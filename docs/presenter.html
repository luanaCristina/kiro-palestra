<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apresentação — Modo Apresentador</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Inter', system-ui, sans-serif; }

  /* Slide iframe — scaled to fit viewport while maintaining 16:9 aspect ratio */
  #slideFrame {
    border: none;
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    width: 1920px;
    height: 1080px;
    transform-origin: top left;
  }

  /* Start screen */
  #startScreen {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(135deg, #003D4F 0%, #1a1a2e 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px; z-index: 100;
    padding: 20px;
  }
  #startScreen h1 { color: #fff; font-size: clamp(18px, 4vw, 28px); font-weight: 300; text-align: center; }
  #startScreen h1 span { color: #F2617A; font-weight: 700; }

  .btn-group {
    display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; align-items: center;
  }
  #startBtn {
    padding: 16px 48px; font-size: clamp(16px, 3vw, 20px); font-weight: 700;
    background: #F2617A; color: #fff; border: none; border-radius: 8px;
    cursor: pointer; transition: transform 0.1s, background 0.2s;
    text-decoration: none; display: inline-block;
  }
  #startBtn:hover { background: #e04e68; transform: scale(1.02); }

  .home-btn {
    padding: 16px 32px; font-size: clamp(14px, 2.5vw, 18px); font-weight: 600;
    background: rgba(255,255,255,0.1); color: #fff; border: 1.5px solid rgba(255,255,255,0.3);
    border-radius: 8px; cursor: pointer; transition: all 0.2s;
    text-decoration: none; display: inline-block;
  }
  .home-btn:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.5); }

  #startScreen p { color: rgba(255,255,255,0.5); font-size: clamp(12px, 2vw, 14px); text-align: center; }

  /* Navigation overlay (visible on hover/touch at bottom) */
  #navOverlay {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: 60px; display: flex; align-items: center; justify-content: center; gap: 12px;
    background: rgba(0,0,0,0.7); backdrop-filter: blur(6px);
    opacity: 0; transition: opacity 0.3s; z-index: 50;
    padding: 0 16px;
  }
  #navOverlay:hover, #navOverlay.visible { opacity: 1; }
  #navOverlay button {
    padding: 8px 16px; border: none; border-radius: 6px;
    font-size: 14px; font-weight: 600; cursor: pointer; color: #fff;
    white-space: nowrap;
  }
  #navOverlay .prev { background: rgba(255,255,255,0.15); }
  #navOverlay .prev:hover { background: rgba(255,255,255,0.25); }
  #navOverlay .next { background: #F2617A; }
  #navOverlay .next:hover { background: #e04e68; }
  #navOverlay .counter { color: rgba(255,255,255,0.6); font-size: 13px; min-width: 60px; text-align: center; }
  #navOverlay .exit { background: rgba(255,255,255,0.1); font-size: 12px; }
  #navOverlay .home { background: rgba(255,255,255,0.1); font-size: 12px; }

  /* Mobile touch area for navigation */
  @media (max-width: 768px) {
    #navOverlay { opacity: 1; height: 50px; }
    #navOverlay button { padding: 6px 12px; font-size: 12px; }
  }

  @media (max-width: 480px) {
    .btn-group { flex-direction: column; }
    #startBtn { padding: 14px 32px; }
    .home-btn { padding: 12px 24px; }
  }
</style>
</head>
<body>

<!-- Start screen with fullscreen button -->
<div id="startScreen">
  <h1>E se o <span>QA</span> pudesse ler o Jira, o Confluence e o código?</h1>
  <div class="btn-group">
    <button id="startBtn" onclick="startPresentation()">▶ Apresentar em Tela Cheia</button>
    <a class="home-btn" href="index.html">🏠 Voltar ao Início</a>
  </div>
  <p>18 slides · Navegue com ← → · Esc para sair</p>
  <p style="margin-top:12px;"><a href="#" onclick="exportPDF(); return false;" style="color:#F2617A; font-size:clamp(13px,2vw,16px); text-decoration:underline;">📄 Exportar como PDF (para LinkedIn)</a></p>
</div>

<!-- Iframe that holds the slides -->
<iframe id="slideFrame" src="" style="display:none;"></iframe>

<!-- Navigation overlay -->
<div id="navOverlay">
  <button class="prev" onclick="prevSlide()">← Voltar</button>
  <span class="counter" id="counter">1 / 18</span>
  <button class="next" onclick="nextSlide()">Próximo →</button>
  <button class="home" onclick="window.location.href='index.html'">🏠</button>
  <button class="exit" onclick="exitPresentation()">✕ Sair</button>
</div>

<script>
  const TOTAL = 18;
  let current = 1;
  let presenting = false;

  function getUrl(n) {
    return `page${n}.html`;
  }

  function updateCounter() {
    document.getElementById('counter').textContent = `${current} / ${TOTAL}`;
  }

  // Scale the iframe to fit viewport perfectly (like object-fit: contain for 16:9)
  function scaleFrame() {
    const frame = document.getElementById('slideFrame');
    if (!frame || frame.style.display === 'none') return;
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const scale = Math.min(vw / 1920, vh / 1080);
    const offsetX = (vw - 1920 * scale) / 2;
    const offsetY = (vh - 1080 * scale) / 2;
    frame.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${scale})`;
  }

  function loadSlide(n) {
    if (n < 1 || n > TOTAL) return;
    current = n;
    document.getElementById('slideFrame').src = getUrl(n);
    updateCounter();
    scaleFrame();
  }

  function nextSlide() {
    if (current < TOTAL) loadSlide(current + 1);
  }

  function prevSlide() {
    if (current > 1) loadSlide(current - 1);
  }

  function startPresentation() {
    presenting = true;
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('slideFrame').style.display = 'block';
    loadSlide(1);
    scaleFrame();

    // Try fullscreen (may fail on some mobile browsers — that's ok)
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else if (document.documentElement.webkitRequestFullscreen) {
      document.documentElement.webkitRequestFullscreen();
    }
  }

  function exitPresentation() {
    if (document.fullscreenElement) {
      document.exitFullscreen();
    } else if (document.webkitFullscreenElement) {
      document.webkitExitFullscreen();
    }
    presenting = false;
    document.getElementById('startScreen').style.display = 'flex';
    document.getElementById('slideFrame').style.display = 'none';
  }

  // Rescale on window resize / orientation change
  window.addEventListener('resize', scaleFrame);
  window.addEventListener('orientationchange', () => setTimeout(scaleFrame, 200));

  // Keyboard navigation
  document.addEventListener('keydown', function(e) {
    if (!presenting) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        startPresentation();
      }
      return;
    }

    if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
      e.preventDefault();
      nextSlide();
    }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
      e.preventDefault();
      prevSlide();
    }
    if (e.key === 'Home') {
      e.preventDefault();
      loadSlide(1);
    }
    if (e.key === 'End') {
      e.preventDefault();
      loadSlide(TOTAL);
    }
    if (e.key === 'Escape') {
      exitPresentation();
    }
  });

  // Touch/swipe support for mobile
  let touchStartX = 0;
  let touchStartY = 0;
  document.addEventListener('touchstart', function(e) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  document.addEventListener('touchend', function(e) {
    if (!presenting) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    // Only register horizontal swipes (more horizontal than vertical, min 50px)
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
      if (dx < 0) nextSlide();
      else prevSlide();
    }
  }, { passive: true });

  // Show nav on mouse move at bottom
  let navTimeout;
  document.addEventListener('mousemove', function(e) {
    const nav = document.getElementById('navOverlay');
    if (!presenting) return;
    if (e.clientY > window.innerHeight - 100) {
      nav.classList.add('visible');
    }
    clearTimeout(navTimeout);
    navTimeout = setTimeout(() => nav.classList.remove('visible'), 3000);
  });

  // Handle fullscreen exit
  document.addEventListener('fullscreenchange', function() {
    if (!document.fullscreenElement && presenting) {
      // Still presenting but exited fullscreen — keep slides visible, just rescale
      scaleFrame();
    }
  });

  // Export PDF
  window.exportPDF = function() {
    const printWin = window.open('', '_blank');
    printWin.document.write(`<!DOCTYPE html><html><head><title>Palestra Kiro MCP - PDF</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; }
  .sp {
    width: 100vw;
    height: 56.25vw;
    position: relative;
    overflow: hidden;
    page-break-after: always;
    page-break-inside: avoid;
  }
  .sp .slide-container {
    transform-origin: top left;
    position: absolute;
    top: 0; left: 0;
  }
  .sp:last-child { page-break-after: avoid; }
  @media print {
    @page { size: 1920px 1080px; margin: 0; }
    .sp { width: 1920px; height: 1080px; }
    .sp .slide-container { transform: none !important; }
  }
  @media screen {
    .sp .slide-container {
      transform: scale(calc(100vw / 1920));
    }
  }
</style>
</head><body><p style="text-align:center;padding:40px;font-family:sans-serif">Carregando ${TOTAL} slides...</p></body></html>`);

    const urls = [];
    for (let i = 1; i <= TOTAL; i++) urls.push(`page${i}.html`);

    Promise.all(urls.map((url, idx) =>
      fetch(url).then(r => r.text()).then(html => {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const container = doc.querySelector('.slide-container');
        const styles = Array.from(doc.querySelectorAll('style')).map(s => s.outerHTML).join('');
        return { idx, html: container ? '<div class="sp">' + styles + container.outerHTML + '</div>' : '' };
      })
    )).then(pages => {
      pages.sort((a, b) => a.idx - b.idx);
      printWin.document.body.innerHTML = pages.map(p => p.html).join('');
      setTimeout(() => {
        printWin.document.title = 'Palestra-Kiro-MCP-LinkedIn';
        printWin.print();
      }, 1000);
    });
  };
</script>
</body>
</html>
