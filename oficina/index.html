<!DOCTYPE html>
<html lang="pt-BR" data-theme="light" style=""><head>
<meta charset="utf-8">
<title>Cover — Oficina Kiro + MCP</title>
<link rel="stylesheet" href="../assets/chrome.css">
<style>
  .slide-container { background: #003D4F; }
  .hero-title {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 72px;
    line-height: 1.08;
    color: #FFFFFF;
    letter-spacing: -0.025em;
  }
  .hero-title .accent { color: #F2617A; }
  .event-pill {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 14px 28px;
    border: 1.5px solid rgba(242,97,122,0.6);
    border-radius: 4px;
    background: rgba(242,97,122,0.08);
  }
  .event-pill .dot { width: 10px; height: 10px; border-radius: 50%; background: #F2617A; }
  .event-pill .label { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 22px; color: #F2617A; letter-spacing: 0.02em; }
  .speaker-line { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 28px; color: rgba(255,255,255,0.85); letter-spacing: 0.01em; }
  .speaker-line .name { color:#FFFFFF; font-weight:700; }
</style>
<link rel="stylesheet" href="nav.css">
</head>
<body style="user-select: none;">
<div class="slide-container" data-screen-label="01 Cover" style="position:relative; width:1920px; height:1080px; overflow:hidden; background:#003D4F;">

  <!-- Geometric decoration: large coral slash on right -->
  <div data-object="true" data-object-type="shape" style="position:absolute; left:1480px; top:-80px; width:520px; height:1260px; background:#F2617A; transform: skewX(-18deg); z-index:1; opacity:0.96;"></div>
  <div data-object="true" data-object-type="shape" style="position:absolute; left:1390px; top:-80px; width:60px; height:1260px; background:rgba(255,255,255,0.08); transform: skewX(-18deg); z-index:1;"></div>

  <!-- Event tag -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:180px; z-index:10;">
    <div class="event-pill">
      <span class="dot"></span>
      <span class="label">OFICINA 2–4H · HANDS-ON PRÁTICO</span>
    </div>
  </div>

  <!-- Hero title -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:290px; width:1280px; z-index:10;">
    <div class="hero-title">
      Desenvolvimento<br>
      Assistido por <span class="accent">IA</span><br>
      com <span class="accent">Kiro</span> + <span class="accent">MCP</span>
    </div>
  </div>

  <!-- subtitle -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:640px; width:1280px; z-index:10;">
    <div style="font-family:'Inter',sans-serif; font-weight:400; font-size:32px; color:rgba(255,255,255,0.8); line-height:1.5;">
      Do zero ao deploy · <span style="color:#F2617A; font-weight:600;">Jira</span> · <span style="color:#F2617A; font-weight:600;">Confluence</span> · <span style="color:#F2617A; font-weight:600;">GitHub</span>
    </div>
  </div>

  <!-- speaker -->
  <div data-object="true" data-object-type="textbox" style="position:absolute; left:80px; top:940px; width:1280px; z-index:10;">
    <div class="speaker-line">
      <span class="name">Luana Cristina</span> &nbsp;·&nbsp; Professora ETE-PE e Quality Analyst Consultant at Thoughtworks
    </div>
  </div>

  <!-- footer -->
  <div data-object="true" data-object-type="textbox" class="tw-footer on-dark" style="z-index:10;">© 2026 Luana Cristina &nbsp;|&nbsp; ETE-PE</div>
  <div data-object="true" data-object-type="textbox" class="tw-page-num on-dark" style="z-index:10;">01</div>
</div>

<script src="nav.js"></script>
</body></html>
